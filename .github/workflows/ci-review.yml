name: Automated Code Review

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write  # Bắt buộc để bot có quyền comment vào PR

jobs:
  build-and-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Tests and Generate Checkstyle Report
        run: mvn test checkstyle:checkstyle

      - name: Run Checkstyle Action (Inline Feedback)
        uses: dbelyaev/action-checkstyle@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_on_error: true